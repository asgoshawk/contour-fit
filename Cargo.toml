[workspace]
members = ["crates/contour-fit-core", "crates/contour-fit-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/asgoshawk/contour-fit"

[workspace.dependencies]
kurbo = { version = "=0.13.1", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
png = "=0.18.1"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
resvg = { version = "=0.48.1", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
